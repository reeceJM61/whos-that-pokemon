name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    env:
      FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check app imports and routes register
        working-directory: src
        run: |
          python -c "
          import app
          routes = [r.rule for r in app.app.url_map.iter_rules()]
          print('Registered routes:', routes)
          assert '/' in routes
          assert '/image' in routes
          "

      - name: Start Flask app in background
        working-directory: src
        run: |
          python app.py &
          echo $! > flask.pid
          # give it a moment to bind the port
          for i in {1..10}; do
            curl -s http://localhost:5000/ -o /dev/null && break
            sleep 1
          done

      - name: Hit the homepage
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/)
          echo "Status: $status"
          test "$status" = "200"

      - name: Hit the image endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/image)
          echo "Status: $status"
          test "$status" = "200"

      - name: Stop Flask app
        if: always()
        working-directory: src
        run: |
          if [ -f flask.pid ]; then
            kill "$(cat flask.pid)" || true
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pokemon-guesser .

      - name: Run container and smoke-test
        run: |
          docker run -d -p 5000:5000 \
            -e FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" \
            --name pokemon-guesser pokemon-guesser
          for i in {1..10}; do
            curl -s http://localhost:5000/ -o /dev/null && break
            sleep 1
          done
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/)
          echo "Status: $status"
          test "$status" = "200"

      - name: Show container logs on failure
        if: failure()
        run: docker logs pokemon-guesser

      - name: Clean up container
        if: always()
        run: docker rm -f pokemon-guesser || true
